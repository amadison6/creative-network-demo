<body>
<div class="loading" id="loading"><strong>Loading Creative Network…</strong><span>v23 · studios + creative spaces</span></div>
<script>
(async()=>{
  const files=['legacy/v21parts/p1a.b64','legacy/v21parts/p1b.b64','legacy/v21parts/p2.b64','legacy/v21parts/p3.b64','legacy/v21parts/p4.b64'];
  const parts=[];
  for(const file of files){
    const url=new URL(file,location.href);
    url.searchParams.set('v','23-studio-layer');
    const response=await fetch(url,{cache:'no-store'});
    if(!response.ok) throw new Error(file+' returned '+response.status);
    parts.push((await response.text()).trim());
  }
  const binary=atob(parts.join(''));
  const bytes=Uint8Array.from(binary,c=>c.charCodeAt(0));
  if(typeof DecompressionStream==='undefined') throw new Error('This browser does not support gzip decompression');
  const stream=new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));
  let html=await new Response(stream).text();
  const patch="\n(()=>{\n  // v22: collectives become constellation labels; no separate planet bubbles.\n  const style=document.createElement(\"style\");\n  style.textContent=`\n    .edge.budding{stroke:#596576;stroke-width:1.25;stroke-dasharray:2 5;opacity:.44}\n    .edge.potential{stroke:#596576;stroke-width:1.05;stroke-dasharray:8 7;opacity:.27}\n    .v22-constellation-label{fill:#d8dde5;font-size:12px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;cursor:pointer;opacity:.84;paint-order:stroke;stroke:#0b0c0f;stroke-width:4px;stroke-linejoin:round}\n    .v22-constellation-sub{fill:#7f8998;font-size:9px;letter-spacing:.08em;text-transform:uppercase;pointer-events:none;opacity:.8}\n    #gravityBtn.active{background:#1f2e40;border-color:#557aa6;color:#dcecff}\n    .v22-line-key{display:inline-block;width:26px;height:0;vertical-align:middle;margin-right:7px;border-top:1.5px solid #687384;opacity:.85}\n    .v22-line-key.strong{border-top:2px solid #a58d59}\n    .v22-line-key.budding{border-top:2px dotted #687384}\n    .v22-line-key.potential{border-top:2px dashed #687384;opacity:.58}\n  `;\n  document.head.appendChild(style);\n\n  const sub=document.querySelector(\".sidebar .sub\");\n  if(sub)sub.textContent=\"Creative Network Demo · v22 · canonical\";\n\n  const orbitBtn=document.getElementById(\"orbitBtn\");\n  if(orbitBtn){\n    orbitBtn.title=\"Orbit visible profiles clockwise around uh_sar\";\n    if(!document.getElementById(\"gravityBtn\")){\n      const gravity=document.createElement(\"button\");\n      gravity.className=\"version-btn\";\n      gravity.id=\"gravityBtn\";\n      gravity.title=\"Experimental: connected profiles exert a subtle pull in Orbit mode\";\n      gravity.textContent=\"◌ Gravity\";\n      orbitBtn.insertAdjacentElement(\"afterend\",gravity);\n    }\n  }\n\n  // Connection stages: strong = solid, blank = budding, future = potential.\n  edges.forEach(e=>{\n    if(e[2]===\"future\")e[2]=\"potential\";\n    else if(!e[2])e[2]=\"budding\";\n  });\n\n  const legend=document.querySelector(\".legend\");\n  if(legend && !legend.querySelector(\".v22-line-key\")){\n    const wrap=document.createElement(\"div\");\n    wrap.style.marginTop=\"7px\";\n    wrap.innerHTML=\n      '<div><span class=\"v22-line-key strong\"></span>Established / strong</div>'+\n      '<div><span class=\"v22-line-key budding\"></span>Budding connection</div>'+\n      '<div><span class=\"v22-line-key potential\"></span>Potential connection</div>';\n    legend.appendChild(wrap);\n  }\n\n  function collectiveMembershipsForV22(n){\n    if(!n || n.profileType===\"collective\")return[];\n    return nodes.filter(c=>c.profileType===\"collective\").filter(c=>{\n      if(c.hub===\"God's Contraband\")return (n.tags||[]).includes(\"God's Contraband\");\n      return n.hub===c.hub;\n    });\n  }\n\n  const baseVisibleNode=visibleNode;\n  visibleNode=function(n){\n    if(!n || n.profileType===\"collective\")return false;\n    const q=(document.getElementById(\"search\")?.value||\"\").trim().toLowerCase();\n    const memberships=collectiveMembershipsForV22(n);\n    const filterOk=currentFilter===\"Bands & Collectives\"\n      ? memberships.length>0\n      : currentFilter===\"All\"||(n.tags||[]).includes(currentFilter);\n    const hay=[n.name,n.role,n.hub,n.bio,...memberships.map(c=>c.name)].join(\" \").toLowerCase();\n    return filterOk&&(!q||hay.includes(q));\n  };\n\n  // Keep collective profiles accessible via the constellation name.\n  let constellationLabels=[];\n  function drawConstellationLabels(){\n    constellationLabels=[];\n    if(currentFilter!==\"Bands & Collectives\" || currentView!==\"relationship\")return;\n    nodes.filter(n=>n.profileType===\"collective\").forEach(c=>{\n      const memberIds=nodes\n        .filter(n=>visibleNode(n)&&collectiveMembershipsForV22(n).some(x=>x.id===c.id))\n        .map(n=>n.id);\n      if(!memberIds.length)return;\n      const pts=memberIds.map(id=>motionState[id]||ensureMotionState(nodes.find(n=>n.id===id))).filter(Boolean);\n      const cx=pts.reduce((a,x)=>a+x.x,0)/pts.length;\n      const minY=Math.min(...pts.map(x=>x.y));\n      const label=make(\"text\",{x:cx,y:minY-42,class:\"v22-constellation-label\",\"text-anchor\":\"middle\"});\n      label.textContent=c.name;\n      label.addEventListener(\"click\",()=>showProfile(c));\n      viewport.appendChild(label);\n      const meta=make(\"text\",{x:cx,y:minY-28,class:\"v22-constellation-sub\",\"text-anchor\":\"middle\"});\n      meta.textContent=memberIds.length+\" \"+(memberIds.length===1?\"member\":\"members\");\n      viewport.appendChild(meta);\n      constellationLabels.push({label,meta,memberIds});\n    });\n  }\n\n  const baseRender=render;\n  render=function(){\n    baseRender();\n    drawConstellationLabels();\n  };\n\n  function keepConstellationLabelsAttached(){\n    if(constellationLabels.length){\n      constellationLabels.forEach(item=>{\n        const pts=item.memberIds.map(id=>motionState[id]).filter(Boolean);\n        if(!pts.length)return;\n        const cx=pts.reduce((a,x)=>a+x.x,0)/pts.length;\n        const minY=Math.min(...pts.map(x=>x.y));\n        item.label.setAttribute(\"x\",cx.toFixed(2));\n        item.label.setAttribute(\"y\",(minY-42).toFixed(2));\n        item.meta.setAttribute(\"x\",cx.toFixed(2));\n        item.meta.setAttribute(\"y\",(minY-28).toFixed(2));\n      });\n    }\n    requestAnimationFrame(keepConstellationLabelsAttached);\n  }\n  requestAnimationFrame(keepConstellationLabelsAttached);\n\n  // Orbit is explicitly clockwise. In SVG screen coordinates a positive angle advances clockwise.\n  const basePrimeOrbit=primeOrbit;\n  primeOrbit=function(){\n    basePrimeOrbit();\n    Object.values(orbitConfig).forEach(cfg=>{cfg.speed=Math.abs(cfg.speed||.04)});\n  };\n\n  // Experimental gravitational pull: relationship strength changes how strongly connected planets tug.\n  let gravityMode=false;\n  const gravityBtn=document.getElementById(\"gravityBtn\");\n  function setGravityMode(on){\n    gravityMode=!!on;\n    if(gravityMode && !orbitMode)setOrbitMode(true);\n    if(gravityBtn){\n      gravityBtn.classList.toggle(\"active\",gravityMode);\n      gravityBtn.textContent=gravityMode?\"● Gravity\":\"◌ Gravity\";\n    }\n  }\n  if(gravityBtn)gravityBtn.onclick=()=>setGravityMode(!gravityMode);\n\n  function gravityFrame(){\n    if(gravityMode && orbitMode && currentView===\"relationship\"){\n      const visibleIds=new Set(nodes.filter(visibleNode).map(n=>n.id));\n      edges.forEach(([a,b,stage])=>{\n        if(!visibleIds.has(a)||!visibleIds.has(b))return;\n        const na=nodes.find(n=>n.id===a),nb=nodes.find(n=>n.id===b);\n        if(!na||!nb||na.profileType===\"collective\"||nb.profileType===\"collective\")return;\n        const sa=motionState[a]||ensureMotionState(na),sb=motionState[b]||ensureMotionState(nb);\n        let dx=sb.x-sa.x,dy=sb.y-sa.y,d=Math.hypot(dx,dy);\n        if(d<1)return;\n        const weight=stage===\"strong\"?1:(stage===\"budding\"?.36:.06);\n        const force=Math.min(.0038,weight*.0025*Math.max(.35,Math.min(1.5,d/180)));\n        const nx=dx/d,ny=dy/d;\n        sa.vx+=nx*force;sa.vy+=ny*force;\n        sb.vx-=nx*force;sb.vy-=ny*force;\n      });\n    }\n    requestAnimationFrame(gravityFrame);\n  }\n  requestAnimationFrame(gravityFrame);\n\n  // Update view copy for the new Bands/Collectives behavior.\n  document.querySelectorAll('.filter[data-filter=\"Bands & Collectives\"]').forEach(btn=>{\n    btn.title=\"Show people grouped into their band / collective constellations\";\n  });\n\n  // Keep sync packets aligned with this release.\n  const syncBtn=document.getElementById(\"syncBtn\");\n  if(syncBtn && syncBtn.onclick){\n    const prior=syncBtn.onclick;\n    syncBtn.onclick=function(e){\n      prior.call(this,e);\n      requestAnimationFrame(()=>{\n        const t=document.getElementById(\"syncPayload\");\n        if(t)t.value=t.value.replace(/Creative Network v21/g,\"Creative Network v22\");\n      });\n    };\n  }\n\n  if(typeof APP_RELEASES!==\"undefined\" && !APP_RELEASES.some(r=>r.version===\"v22\")){\n    APP_RELEASES.unshift({\n      version:\"v22\",file:null,date:\"2026-09-17\",\n      title:\"Constellation collectives + clockwise orbit + connection gravity\",\n      notes:[\n        \"Bands and collectives no longer render as planet bubbles; they appear as clickable constellation names over their member clusters\",\n        \"Bands / Collectives filter reveals the people inside each group\",\n        \"Orbit mode now moves every visible profile clockwise around uh_sar\",\n        \"Added an experimental Gravity toggle: connected profiles exert a subtle pull based on connection strength\",\n        \"Connection lines now encode relationship stage: solid strong, dotted budding, dashed potential\"\n      ]\n    });\n  }\n\n  // Re-render once so the new rules take effect immediately.\n  render();\n})();\n";
  const patch23="\n(()=>{\n  // v23 — Studio layer. Studios stay hidden until the Studios filter is chosen.\n  const jonah=nodes.find(n=>n.id===\"jonah\");\n  if(jonah){\n    jonah.profileType=\"musician\";\n    if(!jonah.tags.includes(\"Musicians\"))jonah.tags.push(\"Musicians\");\n    jonah.resources=\"Has access to / operates a studio; studio details are tracked as a separate place profile.\";\n  }\n\n  const studios=[\n    {\n      id:\"studio_downtown_rehearsals\",name:\"Downtown Rehearsals\",role:\"Rehearsal / Recording Space\",\n      profileType:\"studio\",type:\"hubnode\",r:23,tags:[\"All\",\"Studios\"],hub:\"Studio Spaces\",\n      location:\"Downtown Los Angeles\",capacity:\"About 10 people max\",\n      access:\"Access currently comes through Balam\",\n      availability:\"Private / by arrangement\",\n      frequentPeople:\"Balam · uh_sar · Dante · Drew (historical) · God's Contraband\",\n      resources:\"Drums · multiple guitar amps · multiple bass amps · 16-channel Focusrite setup\",\n      history:\"Balam has rented the room for more than a decade. Dante used to share the lease. Drew was also a long-time tenant. Most of God's Contraband was recorded here.\",\n      bio:\"Long-running rehearsal and recording room central to the God's Contraband recording process. Public demo intentionally keeps the location coarse.\"\n    },\n    {\n      id:\"studio_the_school\",name:\"The School\",role:\"Private Creative / Rehearsal Room\",\n      profileType:\"studio\",type:\"hubnode\",r:24,tags:[\"All\",\"Studios\"],hub:\"Studio Spaces\",\n      location:\"Los Angeles\",capacity:\"Roughly 3× the size of Downtown Rehearsals\",\n      access:\"uh_sar controls access\",\n      availability:\"Weekdays after 5 PM to avoid disrupting students\",\n      frequentPeople:\"uh_sar · Free · Solomon\",\n      resources:\"Fender Jazz Bass · Fender Telecaster · 64-key Nord (organ / piano / synth sections) · 2 medium KRK monitors · Akai MPC Mini · Solomon's bass · Solomon's microphone\",\n      history:\"uh_sar and Free work here often. Solomon has also used the room; sessions have been less frequent while Solomon is in rollout mode.\",\n      bio:\"A large second-floor creative room at the family school. Public demo intentionally omits the street address.\"\n    },\n    {\n      id:\"studio_drew_hollywood\",name:\"Drew's Hollywood Studio\",role:\"Recording / Creative Studio\",\n      profileType:\"studio\",type:\"hubnode\",r:22,tags:[\"All\",\"Studios\"],hub:\"Studio Spaces\",\n      location:\"Hollywood, Los Angeles\",capacity:\"TBD\",\n      access:\"Drew primary; Cam shares the space; Balam also uses it\",\n      availability:\"TBD\",\n      frequentPeople:\"Drew · Cam · Balam\",\n      resources:\"Equipment inventory still needs to be mapped\",\n      history:\"Drew moved into his own Hollywood studio after being a long-time Downtown Rehearsals tenant.\",\n      bio:\"Hollywood studio used by Drew, Cam, and Balam. Equipment, capacity, and access details still need to be fleshed out.\"\n    },\n    {\n      id:\"studio_jonah\",name:\"Jonah's Studio\",role:\"Recording Studio\",\n      profileType:\"studio\",type:\"hubnode\",r:21,tags:[\"All\",\"Studios\"],hub:\"Studio Spaces\",\n      location:\"TBD\",capacity:\"TBD\",access:\"Jonah\",availability:\"TBD\",\n      frequentPeople:\"Jonah\",\n      resources:\"TBD — needs an exploratory visit / conversation\",\n      history:\"Known studio resource in Jonah's orbit; details are not mapped yet.\",\n      bio:\"Studio to explore further. Equipment, room details, access, and regular collaborators are still open questions.\"\n    },\n    {\n      id:\"studio_diontae_inglewood\",name:\"Diontae's Inglewood Space\",role:\"Private Recording / Rehearsal Space\",\n      profileType:\"studio\",type:\"hubnode\",r:21,tags:[\"All\",\"Studios\"],hub:\"Studio Spaces\",\n      location:\"Inglewood, California\",capacity:\"TBD\",access:\"Diontae\",availability:\"By arrangement\",\n      frequentPeople:\"Diontae · God's Contraband\",\n      resources:\"Equipment inventory still needs to be mapped\",\n      history:\"God's Contraband uses the space from time to time.\",\n      bio:\"Private Inglewood creative space associated with Diontae. Exact residential details are intentionally excluded from the public demo.\"\n    }\n  ];\n\n  studios.forEach(s=>{\n    if(!nodes.some(n=>n.id===s.id))nodes.push(s);\n  });\n\n  Object.assign(relationshipPos,{\n    studio_downtown_rehearsals:[330,205],\n    studio_the_school:[675,455],\n    studio_drew_hollywood:[360,515],\n    studio_jonah:[735,250],\n    studio_diontae_inglewood:[665,175]\n  });\n  studios.forEach(s=>{if(!offsets[s.id])offsets[s.id]=[0,0]});\n\n  const studioLinks=[\n    [\"studio_downtown_rehearsals\",\"balam\",\"strong\"],\n    [\"studio_downtown_rehearsals\",\"uh_sar\",\"strong\"],\n    [\"studio_downtown_rehearsals\",\"dante\",\"strong\"],\n    [\"studio_downtown_rehearsals\",\"drew\",\"budding\"],\n    [\"studio_the_school\",\"uh_sar\",\"strong\"],\n    [\"studio_the_school\",\"free\",\"strong\"],\n    [\"studio_the_school\",\"solomon\",\"budding\"],\n    [\"studio_drew_hollywood\",\"drew\",\"strong\"],\n    [\"studio_drew_hollywood\",\"cam\",\"strong\"],\n    [\"studio_drew_hollywood\",\"balam\",\"strong\"],\n    [\"studio_jonah\",\"jonah\",\"strong\"],\n    [\"studio_diontae_inglewood\",\"diontae\",\"strong\"],\n    [\"studio_diontae_inglewood\",\"uh_sar\",\"budding\"]\n  ];\n  studioLinks.forEach(e=>{\n    if(!edges.some(x=>x[0]===e[0]&&x[1]===e[1]||x[0]===e[1]&&x[1]===e[0]))edges.push(e);\n  });\n\n  // Add the filter once, near Places.\n  if(!document.querySelector('.filter[data-filter=\"Studios\"]')){\n    const btn=document.createElement(\"button\");\n    btn.className=\"filter\";\n    btn.dataset.filter=\"Studios\";\n    btn.textContent=\"Studios\";\n    btn.title=\"Reveal studio / rehearsal spaces and the people connected to them\";\n    const places=document.querySelector('.filter[data-filter=\"Places\"]');\n    if(places)places.insertAdjacentElement(\"beforebegin\",btn);\n    else document.querySelector(\".sidebar\")?.appendChild(btn);\n    btn.onclick=()=>{\n      currentFilter=\"Studios\";\n      currentView=\"relationship\";\n      document.querySelectorAll(\".filter\").forEach(b=>b.classList.toggle(\"active\",b===btn));\n      document.querySelectorAll(\".viewbtn\").forEach(b=>b.classList.toggle(\"active\",b.dataset.view===\"relationship\"));\n      const ex=document.getElementById(\"viewExplainer\");\n      if(ex)ex.innerHTML=\"<strong>Studio Layer</strong><br>Spaces stay hidden in normal views. This layer reveals each room plus the collaborators who use or access it.\";\n      if(typeof triggerFilterDrift===\"function\")triggerFilterDrift();\n      render();\n    };\n  }\n\n  const studioPersonIds=new Set([\"uh_sar\",\"balam\",\"dante\",\"drew\",\"free\",\"solomon\",\"cam\",\"jonah\",\"diontae\"]);\n  const visibleBeforeStudios=visibleNode;\n  visibleNode=function(n){\n    const q=(document.getElementById(\"search\")?.value||\"\").trim().toLowerCase();\n    const searchHay=[n.name,n.role,n.hub,n.bio,n.location,n.resources,n.frequentPeople,n.history].filter(Boolean).join(\" \").toLowerCase();\n    const searchOk=!q||searchHay.includes(q);\n\n    if(n.profileType===\"studio\") return currentFilter===\"Studios\" && searchOk;\n    if(currentFilter===\"Studios\") return studioPersonIds.has(n.id) && searchOk;\n    return visibleBeforeStudios(n);\n  };\n\n  // Make studios read as \"stations\" rather than people/planets.\n  function decorateStudioNodes(){\n    studios.forEach(s=>{\n      const g=viewport.querySelector('.node[data-id=\"'+s.id+'\"]');\n      if(!g)return;\n      g.classList.add(\"studio-node\");\n      const c=g.querySelector(\"circle\");\n      if(c){\n        c.setAttribute(\"fill\",\"#252b32\");\n        c.setAttribute(\"stroke\",\"#788391\");\n        c.setAttribute(\"stroke-width\",\"1.4\");\n        c.setAttribute(\"stroke-dasharray\",\"3 3\");\n      }\n    });\n  }\n\n  const renderBeforeStudios=render;\n  render=function(){\n    renderBeforeStudios();\n    decorateStudioNodes();\n  };\n\n  // Studios are anchors/resources, not orbiting planets. People can orbit around them / uh_sar.\n  const primeBeforeStudios=primeOrbit;\n  primeOrbit=function(){\n    primeBeforeStudios();\n    studios.forEach(s=>delete orbitConfig[s.id]);\n  };\n\n  // Enrich the studio profile after the base profile renderer runs.\n  const showProfileBeforeStudios=showProfile;\n  showProfile=function(n){\n    showProfileBeforeStudios(n);\n    if(n.profileType!==\"studio\")return;\n    const profile=document.getElementById(\"profile\");\n    if(!profile)return;\n    const actions=profile.querySelector(\".profile-actions\");\n    const details=document.createElement(\"div\");\n    details.className=\"v23-studio-details\";\n    details.innerHTML=\n      '<div class=\"section-title\">Space Details</div>'+\n      '<div class=\"profile-grid\">'+\n        '<div class=\"card\"><div class=\"k\">Access / control</div><div class=\"v\">'+(n.access||'<span class=\"missing-value\">Not mapped yet</span>')+'</div></div>'+\n        '<div class=\"card\"><div class=\"k\">Availability</div><div class=\"v\">'+(n.availability||'<span class=\"missing-value\">Not mapped yet</span>')+'</div></div>'+\n        '<div class=\"card\"><div class=\"k\">Capacity</div><div class=\"v\">'+(n.capacity||'<span class=\"missing-value\">Not mapped yet</span>')+'</div></div>'+\n        '<div class=\"card\"><div class=\"k\">Frequent people</div><div class=\"v\">'+(n.frequentPeople||'<span class=\"missing-value\">Not mapped yet</span>')+'</div></div>'+\n      '</div>'+\n      '<div class=\"card\" style=\"margin-top:10px\"><div class=\"k\">Equipment / resources</div><div class=\"v\">'+(n.resources||'<span class=\"missing-value\">Not mapped yet</span>')+'</div></div>'+\n      '<div class=\"card\" style=\"margin-top:10px\"><div class=\"k\">History / usage</div><div class=\"v\">'+(n.history||'<span class=\"missing-value\">Not mapped yet</span>')+'</div></div>'+\n      '<div class=\"evidence\" style=\"margin-top:10px\">Studio profiles are structured to grow into equipment inventories, access rules, regular collaborators, sessions, and availability.</div>';\n    if(actions)actions.insertAdjacentElement(\"beforebegin\",details);\n    else profile.appendChild(details);\n  };\n\n  // Studio-specific profiles added through Add Profile should use the Studios tag going forward.\n  const studioSchema=schemas?.studio;\n  if(studioSchema){\n    studioSchema.fields=[\n      [\"newLocation\",\"Area / neighborhood\",\"Keep exact private addresses out of public demo\"],\n      [\"newCapacity\",\"Capacity\",\"Approximate people / room size\"],\n      [\"newResources\",\"Equipment / resources\",\"Instruments, amps, interfaces, monitors...\"],\n      [\"newAccess\",\"Access / control\",\"Who controls access?\"],\n      [\"newAvailability\",\"Availability\",\"Hours / booking rules\"],\n      [\"newFrequentPeople\",\"Frequent people\",\"Regular collaborators / tenants\"]\n    ];\n  }\n\n  const sub=document.querySelector(\".sidebar .sub\");\n  if(sub)sub.textContent=\"Creative Network Demo · v23 · studio layer\";\n\n  if(typeof APP_RELEASES!==\"undefined\"&&!APP_RELEASES.some(r=>r.version===\"v23\")){\n    APP_RELEASES.unshift({\n      version:\"v23\",file:null,date:\"2026-09-17\",\n      title:\"Studio layer\",\n      notes:[\n        \"Added a Studios filter; studio nodes remain hidden in normal views\",\n        \"Seeded Downtown Rehearsals, The School, Drew's Hollywood Studio, Jonah's Studio, and Diontae's Inglewood space\",\n        \"Studio profiles now track access, availability, capacity, frequent people, equipment/resources, and usage history\",\n        \"Jonah's person profile is separated from Jonah's studio\",\n        \"Public demo keeps private addresses coarse while the private database can hold richer notes\"\n      ]\n    });\n  }\n\n  render();\n})();\n";
  html=html.replace('</body>','<script>'+patch+'<\\/script><script>'+patch23+'<\\/script></body>');
  document.open();
  document.write(html);
  document.close();
})().catch(err=>{
  const el=document.getElementById('loading');
