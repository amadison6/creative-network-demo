<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Creative Network</title>
<style>
html,body{margin:0;height:100%;background:#0b0c0f;color:#f4f5f7;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
.loading{height:100%;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:10px}
.loading strong{font-size:18px}.loading span{font-size:12px;color:#8f99a8}
</style>
</head>
<body>
<div class="loading" id="loading"><strong>Loading Creative Network…</strong><span>Creative Network</span></div>
<script>
(async()=>{
  const files=['legacy/v21parts/p1a.b64','legacy/v21parts/p1b.b64','legacy/v21parts/p2.b64','legacy/v21parts/p3.b64','legacy/v21parts/p4.b64'];
  const parts=[];
  for(const file of files){
    const url=new URL(file,location.href);
    url.searchParams.set('v','32-2-group-registry');
    const response=await fetch(url,{cache:'no-store'});
    if(!response.ok)throw new Error(file+' returned '+response.status);
    parts.push((await response.text()).trim());
  }
  const binary=atob(parts.join(''));
  const bytes=Uint8Array.from(binary,c=>c.charCodeAt(0));
  if(typeof DecompressionStream==='undefined')throw new Error('This browser does not support gzip decompression');
  const stream=new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));
  let html=await new Response(stream).text();
  html=html.replace('</body>','<script src="canonical.js?v=32-2-group-registry"><\\/script></body>');
  document.open();
  document.write(html);
  document.close();
})().catch(err=>{
  const el=document.getElementById('loading');
  el.innerHTML='<strong>Could not load Creative Network.</strong><span>'+String(err.message||err)+'</span>';
  console.error(err);
});
</script>
</body>
</html>
