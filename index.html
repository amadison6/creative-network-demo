<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Creative Network</title>
<style>
html,body{margin:0;height:100%;background:#0b0c0f;color:#f4f5f7;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.loading{height:100%;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:10px}.loading strong{font-size:18px}.loading span{font-size:12px;color:#8f99a8}
</style>
</head>
<body>
<div class="loading" id="loading"><strong>Loading Creative Network…</strong><span>v21 · profile editing + orbit mode</span></div>
<script>
(async()=>{
  const url=new URL('legacy/v21/payload.gz',location.href);
  url.searchParams.set('v','21-profile-orbit');
  const response=await fetch(url,{cache:'no-store'});
  if(!response.ok) throw new Error('v21 payload returned '+response.status);
  const bytes=new Uint8Array(await response.arrayBuffer());
  if(typeof DecompressionStream==='undefined') throw new Error('This browser does not support gzip decompression');
  const stream=new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));
  const html=await new Response(stream).text();
  document.open();
  document.write(html);
  document.close();
})().catch(err=>{
  const el=document.getElementById('loading');
  el.innerHTML='<strong>Could not load Creative Network.</strong><span>'+String(err.message||err)+'</span>';
  console.error(err);
});
</script>
</body>
</html>
