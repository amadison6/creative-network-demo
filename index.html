<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Creative Network</title>
<style>
html,body{margin:0;height:100%;background:#0b0c0f;color:#f4f5f7;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.loading{height:100%;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:10px}.loading strong{font-size:18px}.loading span{font-size:12px;color:#8f99a8}
</style>
</head>
<body>
<div class="loading" id="loading"><strong>Loading Creative Network…</strong><span>v19 · bands + collectives</span></div>
<script>
(async()=>{
  const files=[
    'legacy/v19/part01.b64',
    'legacy/v19/part02.b64',
    'legacy/v19/part03.b64',
    'legacy/v19/part04.b64',
    'legacy/v19/part05.b64'
  ];
  async function fetchText(file){
    const url=new URL(file,location.href);
    url.searchParams.set('v','19-collectives');
    const response=await fetch(url,{cache:'no-store'});
    if(!response.ok) throw new Error(file+' returned '+response.status);
    return (await response.text()).trim();
  }
  const parts=[];
  for(const file of files) parts.push(await fetchText(file));
  const b64=parts.join('');
  const binary=atob(b64);
  const bytes=Uint8Array.from(binary,c=>c.charCodeAt(0));
  if(typeof DecompressionStream==='undefined') throw new Error('This browser does not support gzip decompression');
  const stream=new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));
  const html=await new Response(stream).text();
  document.open();
  document.write(html);
  document.close();
})().catch(err=>{
  const el=document.getElementById('loading');
  el.innerHTML='<strong>Could not load Creative Network.</strong><span>'+String(err.message||err)+'</span>';
  console.error(err);
});
</script>
</body>
</html>
